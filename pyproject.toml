[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rubik-cube-solver"
version = "0.1.0"
description = "Hybrid discrete-continuous state-transition optimization research prototype demonstrated on Rubik-style search and energy landscapes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
